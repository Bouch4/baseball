<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petit Joueur de Baseball</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
/* Plan : un terrain géant au centre, tout se touche du doigt. Autocollants à contour marine, gazon vif, terre battue. Une seule page, thème clair assumé. */
:root{
  --sky:#d4ecfb; --sky-d:#b9e0f5; --grass:#59b862; --grass-d:#46a455; --clay:#dc9358;
  --ink:#1c2a56; --red:#e5483a; --blue:#3f78e0; --star:#ffc93c; --paper:#fffdf6; --ok:#1f9d55;
  --c1:#ffe08a; --c2:#ffb4a9; --c3:#b6e6a8; --c4:#a9d4ff;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-weight:700;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--red);outline-offset:3px}
.app{max-width:640px;margin:0 auto;padding:12px 16px 40px;display:flex;flex-direction:column;gap:14px}

.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.title{font-family:var(--display);font-weight:700;font-size:1.5rem;line-height:1.05;margin:0;flex:1;min-width:150px;text-wrap:balance}
.chip{border:3px solid var(--ink);background:var(--paper);border-radius:999px;padding:6px 14px;font-family:var(--display);font-weight:600;font-size:1.15rem;box-shadow:0 3px 0 var(--ink);min-height:44px;display:inline-flex;align-items:center;gap:6px}
button.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.pop{animation:pop .5s ease}
@keyframes pop{40%{transform:scale(1.25) rotate(-4deg)}}

.seg{display:flex;gap:4px;padding:4px;border:3px solid var(--ink);border-radius:999px;background:var(--paper)}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:10px 8px;min-height:46px;font-family:var(--display);font-weight:600;font-size:1.05rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

.crumb{font-family:var(--display);font-weight:600;font-size:1.25rem;text-align:center;margin:0}
.fieldwrap{position:relative;width:100%;max-width:480px;margin:0 auto;border:4px solid var(--ink);border-radius:26px;overflow:hidden;background:var(--sky-d);box-shadow:0 6px 0 var(--ink)}
.fieldwrap svg{display:block;width:100%;height:auto}
.fieldcap{margin:0;text-align:center;font-size:1rem;opacity:.85}

.spot{cursor:pointer}
.spot .ring{display:none;fill:none;stroke:var(--red);stroke-width:5;transform-box:fill-box;transform-origin:center}
.spot.pulse .ring{display:block;animation:pulse 1s ease-in-out infinite}
.spot.sel .ring{display:block;stroke:var(--ink)}
.spot.good .ring{display:block;stroke:var(--ok)}
@keyframes pulse{50%{transform:scale(1.3);opacity:.5}}
.passive .spot{pointer-events:none}
#runner{transition:transform .85s cubic-bezier(.5,0,.3,1);pointer-events:none}

.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti span{position:absolute;bottom:-30px;animation:rise 2s ease-out forwards}
@keyframes rise{to{transform:translateY(-480px) rotate(40deg);opacity:0}}

.rules{background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:10px 14px;box-shadow:0 4px 0 var(--ink)}
.rules summary{font-family:var(--display);font-weight:600;font-size:1.1rem;cursor:pointer;min-height:36px;display:flex;align-items:center}
.rules ul{margin:6px 0 4px;padding-left:20px;display:flex;flex-direction:column;gap:6px;line-height:1.35}
.rules .src{margin:6px 0 0;font-size:.85rem;opacity:.75}
.boom{animation:boom .7s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes boom{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.4);opacity:1}100%{transform:scale(1);opacity:0}}
.rd{transition:transform 1.5s ease-in-out}
.stage,.side{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:960px){
  .app{max-width:1080px;display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);column-gap:28px;row-gap:14px;align-items:start}
  .top,.seg,.crumb{grid-column:1/-1}
  #scen{grid-column:1/-1}
  .fieldwrap{max-width:min(520px,calc((100vh - 240px)*.95))}
  .app.one{grid-template-columns:minmax(0,640px);justify-content:center}
  .app.one .stage,.app.one .side{display:none}
  .menu{grid-template-columns:1fr 1fr 1fr}
  .card{min-height:130px}
}
.boardTitle{font-family:var(--display);font-weight:700;font-size:1.5rem;margin:0;text-align:center}
.src{margin:0;font-size:.9rem;opacity:.8;text-align:center}
.modal{position:fixed;inset:0;background:rgba(28,42,86,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;overflow:auto}
.modal-card{background:var(--paper);border:4px solid var(--ink);border-radius:24px;padding:18px;width:min(440px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 0 var(--ink)}
.modal-card label{font-family:var(--display);font-weight:600}
.modal-card input{font:inherit;font-size:1.3rem;padding:12px;border:3px solid var(--ink);border-radius:14px;background:#fff;min-height:54px;width:100%}
.whoList{display:flex;flex-wrap:wrap;gap:8px}
.whoList .btn{font-size:1.05rem;padding:8px 14px;min-height:48px}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.board li{display:grid;grid-template-columns:2.2rem 1fr auto;gap:10px;align-items:center;border:3px solid var(--ink);border-radius:14px;background:#fff;padding:8px 12px;font-size:1.15rem}
.board li.me{background:#fff0b8}
.board .rk{font-family:var(--display);font-weight:700;text-align:center}
.board .st{font-family:var(--display);font-weight:600}
.c5{background:#e3c8ff}.c6{background:#ffd1a1}.c7{background:#c9f0d3}.c9{background:#ffe9a8}.c8{background:#cfe3ff}
#ball{transition:transform 1.1s cubic-bezier(.2,.7,.3,1);pointer-events:none}
.ballIn.fly{animation:arc 1.1s ease-in-out}
@keyframes arc{50%{transform:translateY(-46px) scale(1.4)}}
.btn.hint{animation:pulseBtn 1s ease-in-out infinite}
.btn:disabled{opacity:.5;cursor:default}
@keyframes pulseBtn{50%{transform:scale(1.08)}}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{border:4px solid var(--ink);border-radius:22px;padding:14px 12px;text-align:center;box-shadow:0 6px 0 var(--ink);display:flex;flex-direction:column;gap:4px;align-items:center;min-height:150px;justify-content:center}
.card:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.card .em{font-size:2.8rem;line-height:1}
.card .nm{font-family:var(--display);font-weight:700;font-size:1.25rem;line-height:1.1}
.card .sub{font-size:.95rem;opacity:.85}
.c1{background:var(--c1)}.c2{background:var(--c2)}.c3{background:var(--c3)}.c4{background:var(--c4)}

.bubble{display:flex;gap:12px;align-items:center;background:var(--paper);border:4px solid var(--ink);border-radius:22px;padding:14px 16px;box-shadow:0 5px 0 var(--ink)}
.bubble p{margin:0;flex:1;font-size:1.3rem;line-height:1.35;font-weight:800}
.round{flex:none;width:52px;height:52px;border-radius:50%;border:3px solid var(--ink);background:var(--star);font-size:1.5rem;box-shadow:0 3px 0 var(--ink)}
.round:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}

.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.btn{border:3px solid var(--ink);background:var(--star);border-radius:16px;padding:12px 20px;font-family:var(--display);font-weight:600;font-size:1.2rem;box-shadow:0 4px 0 var(--ink);min-height:54px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--paper)}

.sc-card{background:var(--paper);border:4px solid var(--ink);border-radius:24px;padding:18px 16px;box-shadow:0 6px 0 var(--ink);display:flex;flex-direction:column;gap:14px}
.sc-emoji{font-size:3.6rem;text-align:center;line-height:1}
.sc-text{margin:0;font-size:1.3rem;line-height:1.35;text-align:center}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;border:3px solid var(--ink);background:#fff;border-radius:18px;padding:12px 14px;min-height:64px;font-size:1.15rem;box-shadow:0 4px 0 var(--ink)}
.choice .ce{font-size:2rem;flex:none}
.choice:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.choice.right{background:#c5efd2;border-color:var(--ok);box-shadow:0 4px 0 var(--ok)}
.choice.wrong{background:#fde0dc;border-color:var(--red);box-shadow:none;animation:shake .35s}
.choice:disabled{opacity:.7;cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{min-height:1.6em;margin:0;font-size:1.15rem;text-align:center;line-height:1.35}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

.pose-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}.pose-h{margin:0 0 6px;text-align:center;font-size:1.05rem}@media(max-width:820px){.pose-grid{grid-template-columns:1fr}}
.pose-card{background:#fff;border:4px solid #1c2a56;border-radius:24px;padding:12px;max-width:1000px;margin:0 auto;box-shadow:0 6px 0 #1c2a56}
.pose-svg{width:100%;max-width:440px;display:block;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none;background:#d6ecff;border-radius:18px}
.pose-svg .hd{cursor:grab}
.pose-list{list-style:none;margin:10px 0 6px;padding:0;display:grid;gap:6px}
.pose-list li{display:flex;gap:8px;align-items:center;font-weight:800;font-size:1rem;padding:6px 10px;border-radius:12px;background:#f1f5ff}
.pose-list li.ok{background:#d9f7dc}
.pose-hint{min-height:2.6em;font-weight:700;text-align:center;margin:6px 0}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button id="homeBtn" class="chip" aria-label="Retour au menu" hidden>🏠 Menu</button>
    <h1 class="title">Petit Joueur de Baseball</h1>
    <button id="whoBtn" class="chip" aria-label="Changer de joueur">👤 <span id="whoName">…</span></button>
    <div id="starChip" class="chip" aria-label="Étoiles gagnées">⭐ <span id="stars">0</span></div>
    <button id="boardBtn" class="chip" aria-label="Classement">🏆</button>
    <button id="soundBtn" class="chip" aria-label="Activer ou couper la voix" aria-pressed="true">🔊</button>
  </header>

  <div class="seg" id="seg" role="group" aria-label="Choisir le terrain">
    <button data-mode="u9" aria-pressed="true">Terrain 9U</button>
    <button data-mode="adult" aria-pressed="false">Grand terrain</button>
  </div>

  <p id="crumb" class="crumb" hidden></p>
  <div class="stage">
  <div id="fieldwrap" class="fieldwrap passive"></div>
  <p id="fieldcap" class="fieldcap"></p>
  </div>

  <div class="side">

  <details id="rulesBox" class="rules">
    <summary>📖 Les règles de ce terrain</summary>
    <ul id="rulesList"></ul>
    <p class="src" id="rulesSrc"></p>
  </details>

  <section id="menu" aria-label="Menu des jeux">
    <div class="menu">
      <button class="card c1" data-act="explore"><span class="em">🔍</span><span class="nm">Découvre le terrain</span><span class="sub">Touche et écoute</span></button>
      <button class="card c2" data-act="quiz"><span class="em">🎯</span><span class="nm">Où est… ?</span><span class="sub">Trouve le bon endroit</span></button>
      <button class="card c3" data-act="run"><span class="em">🏃</span><span class="nm">Cours aux bases</span><span class="sub">Marque un point</span></button>
      <button class="card c5" data-act="hit"><span class="em">🏏</span><span class="nm">Jusqu'où je cours ?</span><span class="sub">Regarde la frappe</span></button>
      <button class="card c7" data-act="def"><span class="em">🧤</span><span class="nm">Défense en match</span><span class="sub">Lance, rattrape, bloque !</span></button>
      <button class="card c8" data-act="bat"><span class="em">🏏</span><span class="nm">À la batte</span><span class="sub">Frappeur et coureur</span></button>
      <button class="card c9" data-act="pose"><span class="em">🧒</span><span class="nm">Le petit frappeur</span><span class="sub">Place ses pieds et ses mains</span></button>
      <button class="card c4" data-act="scen"><span class="em">🤔</span><span class="nm">Que fais-tu ?</span><span class="sub">Les règles du jeu</span></button>
    </div>
  </section>

  <section id="play" hidden>
    <div class="bubble"><p id="bubbleText"></p><button id="replay" class="round" aria-label="Réécouter">🔊</button></div>
    <div id="actions" class="actions"></div>
  </section>

  </div>

  <section id="scen" hidden></section>

  <section id="board" hidden>
    <div class="sc-card">
      <h2 class="boardTitle">🏆 Classement</h2>
      <p id="boardNote" class="src"></p>
      <ol id="boardList" class="board"></ol>
      <div class="actions" style="margin:0"><button class="btn alt" id="boardBack">🏠 Menu</button></div>
    </div>
  </section>

  <div id="who" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="whoTitle">
    <div class="modal-card">
      <h2 id="whoTitle" class="boardTitle">Qui joue ?</h2>
      <div id="whoList" class="whoList"></div>
      <label for="whoInput" id="whoLabel">Ton prénom</label>
      <input id="whoInput" maxlength="12" autocomplete="off" placeholder="Ton prénom">
      <p class="src" id="whoNote">Écris seulement ton prénom ou un pseudo, sans nom de famille.</p>
      <div class="actions" style="margin:0">
        <button class="btn" id="whoGo">C'est parti !</button>
        <button class="btn alt" id="whoCancel" hidden>Annuler</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s);};
var LEADERBOARD_URL='https://baseball-bluejays-default-rtdb.europe-west1.firebasedatabase.app'; // Classement en ligne : colle ici l'adresse de ta base Firebase Realtime Database (ex : https://xxx-default-rtdb.europe-west1.firebasedatabase.app). Vide = classement local seulement.
var state={mode:'u9',stars:0,sound:true,voice:'',rate:0.95,player:'',players:{},dev:'',legacy:0};
var act=null, timers=[], lastSpoken='', ac=null;

/* ---------- utilitaires ---------- */
var BAT_IN='<g transform="rotate(45 32 32)"><path d="M27 5 Q32 1 37 5 L38.5 32 L35.5 37 L35.5 52 Q35.5 55 32 55 Q28.5 55 28.5 52 L28.5 37 L25.5 32 Z" fill="#d9a066" stroke="#1c2a56" stroke-width="3" stroke-linejoin="round"/><rect x="28.5" y="41" width="7" height="10" fill="#1c2a56"/><ellipse cx="32" cy="57" rx="5" ry="3" fill="#d9a066" stroke="#1c2a56" stroke-width="3"/></g>';
var GLOVE_IN='<path d="M17 52 Q8 40 11 27 L13 14 Q14 10 18 12 L21 24 L23 8 Q24 4 28 6 L30 22 L34 8 Q36 5 39.5 7 L39.5 24 L44 12 Q46 9 49.5 11 L48.5 30 Q58 36 52 48 Q48 57 35 58 Q23 60 17 52 Z" fill="#c07a35" stroke="#1c2a56" stroke-width="3" stroke-linejoin="round"/><path d="M22 36 Q32 30 44 36 Q46 46 38 50 Q28 52 24 46 Z" fill="#e0a15f" stroke="#1c2a56" stroke-width="2.5" stroke-linejoin="round"/>';
function svgIco(inner){return '<svg viewBox="0 0 64 64" width="1em" height="1em" style="vertical-align:-.14em" aria-hidden="true">'+inner+'</svg>';}
function ico(t){return String(t).split('🏏').join(svgIco(BAT_IN)).split('🧤').join(svgIco(GLOVE_IN));}

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function later(fn,ms){var a=act;var id=setTimeout(function(){if(act===a)fn();},ms);timers.push(id);}
function cancelTimers(){timers.forEach(clearTimeout);timers=[];}
function save(){try{localStorage.setItem('petit-joueur',JSON.stringify({stars:state.legacy||0,mode:state.mode,sound:state.sound}));}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem('petit-joueur')||'{}');}catch(e){return {};}}
var PRAISE=['Bravo !','Super !','Bien joué !','Génial !','Tu es fort !','Yes !'];

function frVoices(){
  var all=[];try{all=speechSynthesis.getVoices()||[];}catch(e){}
  var fr=all.filter(function(v){return v.lang&&v.lang.toLowerCase().replace('_','-').indexOf('fr')===0;});
  function score(v){
    var n=(v.name||'').toLowerCase(),sc=0;
    if(/natural|neural|premium|enhanced|online/.test(n))sc+=5;
    if(/google/.test(n))sc+=3;
    if(/amélie|amelie|audrey|aurélie|aurelie|thomas|marie|denise|henri|vivienne|remy|rémy/.test(n))sc+=2;
    if(v.lang.toLowerCase().replace('_','-')==='fr-fr')sc+=1;
    return sc;
  }
  return fr.sort(function(a,b){return score(b)-score(a);});
}
function pickVoice(){
  var l=frVoices(),i;
  if(state.voice)for(i=0;i<l.length;i++)if(l[i].voiceURI===state.voice)return l[i];
  return l[0]||null;
}
function say(text,force){
  lastSpoken=text;
  if(!(state.sound||force)||!('speechSynthesis' in window))return;
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang='fr-FR';u.rate=state.rate;u.pitch=1;
    var v=pickVoice();if(v)u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}
function tone(seq){
  if(!state.sound)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    var t=ac.currentTime;
    seq.forEach(function(f){
      var o=ac.createOscillator(),g=ac.createGain();
      o.type='triangle';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.15,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.18);
      o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.2);t+=.14;
    });
  }catch(e){}
}
function good(){tone([660,880,1040]);}
function bad(){tone([320,250]);}
function addStars(n){
  state.stars+=n;$('#stars').textContent=state.stars;
  if(state.player){state.players[state.player]=state.stars;saveP();pushScore();}
  var c=$('#starChip');c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop');save();
}
function setBubble(t,speak){$('#bubbleText').textContent=t;if(speak!==false)say(t);else lastSpoken=t;}
function setCrumb(t){$('#crumb').textContent=t;}

/* ---------- données du terrain ---------- */
function geo(){
  var u9=state.mode==='u9';
  return {home:[200,350],b1:[290,260],b2:[200,170],b3:[110,260],pitcher:u9?[200,305]:[200,262]};
}
function items(){
  var u9=state.mode==='u9',g=geo();
  var L=[
    {id:'home',name:'le marbre',kind:'base',xy:g.home,say:"Le marbre ! C'est la maison. On part d'ici, et on revient ici pour marquer un point."},
    {id:'b1',name:'la première base',kind:'base',xy:g.b1,say:"La première base. C'est la première étape de ta course !"}
  ];
  if(u9)L.push({id:'b1o',name:'la base orange',kind:'base',xy:[308,278],r:17,say:"La base orange, collée à la première base. La première base est doublée : le coureur peut courir sur la base orange, pendant que le défenseur reste sur la base blanche. Comme ça, on évite les collisions !"});
  if(!u9)L.push({id:'b2',name:'la deuxième base',kind:'base',xy:g.b2,say:"La deuxième base. Elle est tout au fond du terrain."});
  L.push({id:'b3',name:u9?'la deuxième base':'la troisième base',kind:'base',xy:g.b3,say:(u9?"La deuxième base.":"La troisième base.")+" Plus qu'un sprint pour rentrer à la maison !"});
  L.push(
    u9?{id:'pitcher',name:'le coach qui lance',kind:'player',team:'c',xy:g.pitcher,say:"Le coach qui lance. C'est un adulte : il lance doucement la balle au frappeur. Le frappeur a 3 essais."}
      :{id:'pitcher',name:'le lanceur',kind:'player',team:'d',xy:g.pitcher,say:"Le lanceur. Il se tient sur le monticule et il lance la balle vers le frappeur."},
    {id:'batter',name:'le frappeur',kind:'player',team:'a',xy:[152,348],say:"Le frappeur. Il tient la batte et il essaie de taper la balle très fort !"},
    {id:'fb',name:'le joueur de première base',kind:'player',team:'d',xy:[264,232],say:"Le joueur de première base. Il rattrape la balle pour faire sortir le coureur."},
    {id:'tb',name:u9?'le joueur de deuxième base':'le joueur de troisième base',kind:'player',team:'d',xy:[136,232],say:u9?"Le joueur de deuxième base. Il garde la deuxième base.":"Le joueur de troisième base. Il garde la troisième base."},
    {id:'ss',name:"l'arrêt-court",kind:'player',team:'d',xy:u9?[200,222]:[150,185],say:"L'arrêt-court. Il rattrape les balles qui roulent au milieu du terrain."}
  );

function startAct(type){

  else if(type==='scen')startScen();
  else if(type==='hit')startHit();
  else if(type==='throw')startThrow();

  else if(type==='pose')startPose();

function onSpot(id){
  if(!act)return;

  else if(act.type==='quiz')quizTap(id);
  else if(act.type==='run')runTap(id);
  else if(act.type==='hit')hitTap(id);

function startQuiz(){
  go('play');
  var pool=items().filter(function(i){return ['home','b1','b1o','b2','b3','pitcher','catcher','batter'].indexOf(i.id)>-1;});
  act={type:'quiz',queue:shuffle(pool).slice(0,6),i:0,tries:0,clean:0,lock:false};
  $('#actions').innerHTML='';
  nextQ();
}
function nextQ(){
  if(act.i>=act.queue.length){endQuiz();return;}
  act.tries=0;act.lock=false;clearMarks();
  setCrumb('Où est… ?  '+(act.i+1)+' / '+act.queue.length);
  setBubble('Touche '+act.queue[act.i].name+' !');
}
function quizTap(id){
  if(act.lock)return;
  var t=act.queue[act.i];
  if(id===t.id){
    act.lock=true;mark(id,'good');good();
    if(act.tries===0)act.clean++;
    addStars(1);
    setBubble(pick(PRAISE)+" C'est "+t.name+' !');
    later(function(){act.i++;nextQ();},2300);
  }else{
    act.tries++;bad();
    {var it=itemById(id);setBubble('Ça, c’est '+(it?it.name:'autre chose')+'. Cherche '+t.name+' !');}
    if(act.tries>=2)mark(t.id,'pulse');
  }
}
function endQuiz(){
  clearMarks();setCrumb('Terminé !');confetti();good();
  setBubble('Bravo ! Tu as trouvé '+act.clean+' endroits du premier coup sur '+act.queue.length+' !');
  $('#actions').innerHTML='<button class="btn" id="again">Rejouer</button><button class="btn alt" id="toMenu">🏠 Menu</button>';
  $('#again').onclick=startQuiz;$('#toMenu').onclick=function(){go('menu');};
}

var helpOn=true;
function startRun(){
  var seq=state.mode==='u9'?['b1','b3','home']:['b1','b2','b3','home'];

function runTap(id){
  if(act.lock)return;

    var r=$('#runner');if(r)r.style.transform='translate('+p[0]+'px,'+p[1]+'px)';
    act.idx++;clearMarks();
    if(act.idx>=act.seq.length){
      later(function(){
        addStars(2);confetti();good();

      },950);
    }

  });

function hitTap(id){

    else if(h.fin==='target')later(function(){moveBall(gg[target][0],gg[target][1],true,1.3);},1400);
    else if(h.fin==='out')later(function(){setFx('<text class="boom" x="'+gg.b1[0]+'" y="'+(gg.b1[1]-26)+'" text-anchor="middle" font-size="30">❌</text>');},1300);
    later(function(){

  var gap=214-(Math.max(A[0],B[0])+15);

function startScen(){

function renderScen(){
  if(act.mixed&&act.i>=act.queue.length){go('scen');act.type='scen';endScen();return;}
  if(act.mixed&&act.queue[act.i].click){batClick();return;}
  if(act.mixed&&act.queue[act.i].runners){go('play');renderField();throwRound();return;}
  act.type='scen';
  if(act.mixed&&$('#scen').hidden)go('scen');
  var q=act.queue[act.i];act.tries=0;act.lock=false;
  setCrumb('Que fais-tu ?  '+(act.i+1)+' / '+act.queue.length);
  var opts=shuffle(q.c.map(function(c,k){return {k:k,e:c[0],l:c[1]};}));
  var h='<div class="sc-card"><div class="sc-emoji" aria-hidden="true">'+ico(q.e)+'</div>'+
    '<p class="sc-text">'+q.t+'</p>'+
    '<div class="actions" style="margin:0"><button class="btn alt" id="listen">🔊 Écouter</button></div>'+
    '<div class="choices">'+opts.map(function(o){return '<button class="choice" data-k="'+o.k+'"><span class="ce">'+ico(o.e)+'</span><span>'+o.l+'</span></button>';}).join('')+'</div>'+
    '<p class="fb" id="fb" aria-live="polite"></p><div class="actions" id="scNext" style="margin:0"></div></div>';
  $('#scen').innerHTML=h;
  $('#listen').onclick=function(){say(q.t,true);};
  Array.prototype.forEach.call($('#scen').querySelectorAll('.choice'),function(b){
    b.onclick=function(){scenPick(b,q);};
  });
  say(q.t);
}
function scenPick(btn,q){
  if(act.lock)return;
  var k=+btn.getAttribute('data-k');
  if(k===q.ok){
    act.lock=true;good();
    if(act.tries===0)act.clean++;
    addStars(1);btn.classList.add('right');
    Array.prototype.forEach.call($('#scen').querySelectorAll('.choice'),function(b){b.disabled=true;});
    var msg=pick(PRAISE)+' '+q.why;
    $('#fb').textContent=msg;say(msg);
    var last=act.i>=act.queue.length-1;
    $('#scNext').innerHTML='<button class="btn" id="nextBtn">'+(last?'Terminer ⭐':'Suivant ➜')+'</button>';
    try{$('#nextBtn').scrollIntoView({behavior:'smooth',block:'nearest'});}catch(e){}
    $('#nextBtn').onclick=function(){if(last)endScen();else{act.i++;renderScen();}};
  }else{
    act.tries++;bad();btn.classList.add('wrong');btn.disabled=true;
    var m='Pas tout à fait, essaie encore !';
    $('#fb').textContent=m;say(m);
  }
}
function endScen(){

  var m='Bravo ! Tu connais bien les règles : '+act.clean+' bonnes réponses du premier coup sur '+act.queue.length+' !';

  say(m);

}

  n=String(n||'').replace(/[^A-Za-zÀ-ÖØ-öø-ÿ0-9 '\-]/g,'').replace(/\s+/g,' ').trim().slice(0,12);
  return n?n.charAt(0).toUpperCase()+n.slice(1):'';

  try{if('speechSynthesis' in window)speechSynthesis.getVoices();}catch(e){}
}
try{
  var hot=window.claude&&window.claude.hot;
  if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
}catch(e){start({});}
})();
